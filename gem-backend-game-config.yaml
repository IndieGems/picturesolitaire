  - id: cb0abfc5-ef5e-4342-9943-241b126afd54
    slug: hints
    display_name: Hints
    max_balance: 10
    client_writable: false
    transfer_policy: none
    bucket_config:
      - { name: earned, priority: 0, reset_interval: never, grant_sources: [reward, system, play, platform_purchase, recipe] }
  - id: f05a54c9-1920-4a36-889d-c03244e8291c
    slug: undos
