# picturesolitaire game config: data the game reads without a new build.
# Ship with: gemctl config upload --dry-run, then gemctl config upload --channel dev
# (the gemctl:game-config skill). `gemctl config schema` is the authority on fields.

save_schemas:
  # The UI's own slot (src/ui/progress.ts): presentation state the server does not
  # decide (which onboarding steps the player has seen). Its old campaign fields
  # (level, won, restored, best) are read ONCE by the win checker, to take in
  # progress made before "progress" below existed; nothing else reads them.
  - key: campaign
    access_self_read: true
    access_self_write: true
    access_game_server_read: true
    access_game_server_write: true
    max_size_bytes: 16384
  # The player's PROGRESS, owned by the server: the player reads it, and only the
  # win checker (functions/checker, progress.rs) writes it, after replaying a win.
  # The campaign position, wins, challenge bests, daily results (the last 100 days)
  # and restored pictures. Pictures grow with the game, about 14 bytes each: 60
  # boards' 519 pictures are 7 KB, so 32 KB would fill near board 190. A write past
  # this size is refused and the checker answers retry("config") for good, so keep
  # it far ahead of the campaign (256 KiB: thousands of boards).
  - key: progress
    access_self_read: true
    access_self_write: false
    access_game_server_read: true
    access_game_server_write: true
    max_size_bytes: 262144
  # Wins the checker has not answered yet (src/net/claims.ts), kept so a win made
  # just before the game closed is sent at the next start. The device's own word
  # and nothing more: the checker replays each claim and applies each claim id once.
  # As many as fit in 120 KiB (about 150 wins); past that, wins that strand
  # nothing are dropped (src/net/held-wins.ts, which must say this slot's size).
  - key: claims
    access_self_read: true
    access_self_write: true
    access_game_server_read: true
    access_game_server_write: false
    max_size_bytes: 131072
  # Helper uses the platform has not taken yet (src/net/helpers.ts): a helper is
  # used at once and taken behind, and a use left unsent when the game closed is
  # sent at the next start. Counts and the one use in flight, a few dozen bytes.
  - key: spends
    access_self_read: true
    access_self_write: true
    access_game_server_read: true
    access_game_server_write: false
    max_size_bytes: 4096

# THE HELPERS (creator, 2026-10-27; AGENTS.md): Hint, Undo and Shuffle are the
# player's own stock, carried from board to board, at most 10 of each, never in
# a save. The ids are src/net/helper-ids.json's (tools/server/helpers-check.mts
# holds the two together). Earned stock never resets and there is no daily top-up.
# Gifts are paid by the win checker, straight into "earned" and clamped at the
# cap: the kit (3 of each) at the end of board 1, a hard board's first win 1 Hint
# and 1 Undo, a trip's last board 1 of each. More are bought with Coins below.
