# PER-BOARD PLAYER NUMBERS (the creator, 2026-10-27): what players do on each
# campaign board, sent by the game (src/ui/board-stats.ts) and read with
# `gemctl analytics event <id> --by board --channel release`. Levels reads tries
# per win (board_started over board_won) and quits per board. Campaign boards
# only; never practice, lessons or the dev menu. Each try sends board_started,
# then exactly one of won, lost or quit when it ends. Every dimension must be
# sent; measures are optional. `board` is the campaign number, SENT AS A STRING
# ("7"): the SDK's track makes every number a measure, so a number here arrives
# without its dimension and is refused (missing_dimension; tested on dev
# 2026-10-27, SDK 15.3.2, whatever its analytics guide's example shows). `attempt` the
# player's try at it since their last win of it; helpers count only uses taken
# from the stock (mercy's free Hint and the lessons are 0).
# Once live, an id, a dimension or a value is permanent: a rename starts over.
analytics_events:
  - id: board_started
    description: "A campaign board dealt and ready to play (a restart sends another, attempt + 1)."
    sources: [client]
    dimensions:
      board: { range: { min: 1, max: 1000 } }
    measures: { attempt: int }
  - id: board_won
    description: "A campaign board's last picture finished: the try it took and the helpers spent on it."
    sources: [client]
    dimensions:
      board: { range: { min: 1, max: 1000 } }
      mercy: { values: ["no", "yes"] }
    measures: { attempt: int, hints: int, undos: int, shuffles: int }
  - id: board_lost
    description: "A campaign board's try ended while stuck (Restart, Home or Back with no move left; a stuck try rescued and won is a win): pictures left and helpers spent."
    sources: [client]
    dimensions:
      board: { range: { min: 1, max: 1000 } }
      mercy: { values: ["no", "yes"] }
    measures: { attempt: int, pictures_left: int, helpers: int }
  - id: board_quit
    description: "A campaign board's try ended unfinished and not stuck (Home, Back, Restart, or the game closed; a tab switch is not one)."
    sources: [client]
    dimensions:
      board: { range: { min: 1, max: 1000 } }
    measures: { attempt: int, pictures_left: int, helpers: int }
  # THE DAILY SUITCASE (docs/daily-suitcase.md): recorded by the win checker itself as it
  # packs, swaps and pays (functions/checker), never by the game, once each (keyed events).
  # `month` is the suitcase's own; make-config refuses to run while a month in
  # src/content/levels/suitcases.json is not declared here. `day` is the day of that month.
  - id: suitcase_item
    description: "A VIP's event item packed by a first win of its day (today's, or a past day's): the event's items held after it, copies of that item, the day of the event (1 to 14)."
    sources: [server]
    dimensions:
      event: { values: ["halloween-2026", "ski-trip-2026", "winter-market-2026"] }
    measures: { collected: int, copies: int, day: int }
  - id: suitcase_swap
    description: "Two spares swapped for a missing item, by a VIP: the event's items held after it, spares left, the day of the event (0 after it)."
    sources: [server]
    dimensions:
      event: { values: ["halloween-2026", "ski-trip-2026", "winter-market-2026"] }
    measures: { collected: int, spares_left: int, day: int }
  - id: suitcase_complete
    description: "An event's suitcase full, its table and helpers paid: by a day's pack or by a swap, on which day of the event (0 after it)."
    sources: [server]
    dimensions:
      event: { values: ["halloween-2026", "ski-trip-2026", "winter-market-2026"] }
      by: { values: ["pack", "swap"] }
    measures: { day: int }
  # FRIEND CHALLENGES (docs/friend-challenges.md), sent by the game (src/net/friends.ts): a
  # challenge sent or not sent from the Arcade's sheet, a link shared, the game opened by either,
  # and the one-off board's result against the friend's moves. `kind` is a campaign board or a daily.
  - id: friend_action
    description: "Friends: a friend challenge sent (or not), a board's link shared, the game opened by one, or a friend's board won, lost or tied against their moves."
    sources: [client]
    dimensions:
      action: { values: ["shared", "challenge_sent", "challenge_not_sent", "opened_challenge", "opened_share", "challenge_won", "challenge_lost", "challenge_tied"] }
      kind: { values: ["board", "daily"] }
  # THE HELPER SHOP AND THE DAILY (release report GSR-005; names agreed with UI, 2026-10-28), sent by
  # the game. `where`: home's Shop, or the shop the run-out panel opens. helper_bought is sent only
  # once the platform confirmed the purchase; `price` is the Coins charged for it in all (a pack's total).
  - id: shop_opened
    description: "The helper shop opened: from home's Shop, or from the panel shown when a helper has run out."
    sources: [client]
    dimensions:
      where: { values: ["home", "run_out"] }
  - id: helper_bought
    description: "A helper bought for Coins, confirmed by the platform: which helper, one or a pack of 3, from which shop, and the Coins charged in all."
    sources: [client]
    dimensions:
      helper: { values: ["hint", "undo", "shuffle"] }
      pack: { values: ["1", "3"] }
      where: { values: ["home", "run_out"] }
    measures: { price: int }
  - id: daily_started
    description: "A try at the daily puzzle opened (a restart sends another)."
    sources: [client]
  - id: daily_ended
    description: "A try at the daily puzzle ended: won, lost (stuck) or quit. One per try."
    sources: [client]
    dimensions:
      result: { values: ["won", "lost", "quit"] }
  # THE COSMETICS SCREEN (the creator, 2026-10-29; names agreed with UI), sent by the game.
  # `where`: home's door, the only one. `id` is the item's slug, one of the items for sale
  # (src/net/tables.json's award "shop", src/net/tracks.json): make-config refuses to run while
  # one is not declared here. A preview is sent once per item per visit, only for an item the
  # player does not own; cosmetic_bought only once the platform confirmed the purchase, `price`
  # the Coins charged.
  - id: cosmetics_opened
    description: "The Cosmetics screen opened (from home)."
    sources: [client]
    dimensions:
      where: { values: ["home"] }
  - id: cosmetic_previewed
    description: "An item for sale on the Cosmetics screen looked at before buying: a table enlarged, or a soundtrack played. Once per item per visit, unowned items only."
    sources: [client]
    dimensions:
      kind: { values: ["table", "track"] }
      id: { values: ["table-paris-cafe", "table-kyoto-blossom", "table-buenos-aires", "table-irish-coast", "track-paris-cafe", "track-japanese-garden", "track-buenos-aires-tango", "track-celtic-folk"] }
  - id: cosmetic_bought
    description: "A table or soundtrack bought for Coins, confirmed by the platform: which, and the Coins charged."
    sources: [client]
    dimensions:
      kind: { values: ["table", "track"] }
      id: { values: ["table-paris-cafe", "table-kyoto-blossom", "table-buenos-aires", "table-irish-coast", "track-paris-cafe", "track-japanese-garden", "track-buenos-aires-tango", "track-celtic-folk"] }
    measures: { price: int }

analytics_funnels:
  # How far players get: from opening the game to each milestone board won.
  - id: campaign_reach
    steps:
      - gem_session_start
      - { event: board_started, where: { board: 1 } }
      - { event: board_won, where: { board: 1 } }
      - { event: board_won, where: { board: 2 } }
      - { event: board_won, where: { board: 3 } }
      - { event: board_won, where: { board: 5 } }
      - { event: board_won, where: { board: 10 } }
      - { event: board_won, where: { board: 15 } }
      - { event: board_won, where: { board: 30 } }
      - { event: board_won, where: { board: 60 } }
      - { event: board_won, where: { board: 90 } }
      - { event: board_won, where: { board: 120 } }
  # A try that ends in a win.
  - id: board_try
    steps: [board_started, board_won]
  # Buying (GSR-005): a shop opened, then a helper bought. `--by where` splits home from run-out.
  - id: buying
    steps: [shop_opened, helper_bought]
  # A new player's way to the shop: the guided first board won, the shop opened, a first helper
  # bought. A funnel of its own, so campaign_reach's history keeps its step names.
  - id: first_session
    steps:
      - gem_session_start
      - { event: board_won, where: { board: 1 } }
      - shop_opened
      - helper_bought
  # A daily try that ends in a win.
  - id: daily_try
    steps:
      - daily_started
      - { event: daily_ended, where: { result: won } }
  # The Cosmetics screen: opened, an item previewed, an item bought (tables against tracks:
  # `gemctl analytics event cosmetic_bought --by kind`).
  - id: cosmetics
    steps: [cosmetics_opened, cosmetic_previewed, cosmetic_bought]

# FRIEND CHALLENGES (docs/friend-challenges.md; the creator, 2026-10-28): the line a friend's Arcade
# inbox shows, sent by src/net/friends.ts with gem.friends.challenge. The friend's Play launches the
# game with the params in the order declared here (?board=62&moves=35&helpers=0, or
# ?date=2026-10-28&moves=35&helpers=0) and the game opens that board as a one-off: no claim, no
# reward, so the checker never sees it. `board` is the campaign position the player reads on home
# (board 62 is c62); `helpers` is forwarded for the challenge card and not in the line, since
# with it the line runs past the platform's 80 characters. A challenge never expires, so the
# daily's names its date, never "today". Players read "level", never "board" (the creator, GSR-016);
# the key and the `board` param keep their names, which the game sends. Every Arcade locale is
# here (the creator chose to translate now, GSR-004), worded as UI's locales/*.json share lines;
# a changed English line needs all eleven again, or test and release refuse the config.
friend_challenge_templates:
  - key: beat_board
    text: "I finished level {board} of Picture Passport in {moves, plural, one {# move} other {# moves}}. Can you beat it?"
    localized:
      de: { text: "Ich habe Level {board} von Picture Passport in {moves, plural, one {# Zug} other {# Zügen}} gelöst. Schlägst du das?" }
      es: { text: "Terminé el nivel {board} de Picture Passport en {moves, plural, one {# movimiento} other {# movimientos}}. ¿Lo superas?" }
      fr: { text: "J'ai fini le niveau {board} de Picture Passport en {moves, plural, one {# coup} other {# coups}}. Tu fais mieux ?" }
      it: { text: "Ho finito il livello {board} di Picture Passport in {moves, plural, one {# mossa} other {# mosse}}. Mi batti?" }
      ja: { text: "Picture Passportのレベル{board}を{moves, plural, other {#手}}でクリアしたよ。もっと少ない手数でできる？" }
      ko: { text: "Picture Passport 레벨 {board}, {moves, plural, other {#수}} 만에 클리어! 더 적게 할 수 있나요?" }
      pl: { text: "Poziom {board} w Picture Passport ukończony w {moves, plural, one {# ruchu} few {# ruchach} many {# ruchach} other {# ruchu}}. Dasz radę lepiej?" }
      pt-BR: { text: "Terminei o nível {board} de Picture Passport em {moves, plural, one {# jogada} other {# jogadas}}. Supera essa?" }
      ru: { text: "Уровень {board} в Picture Passport пройден за {moves, plural, one {# ход} few {# хода} many {# ходов} other {# хода}}. Сможешь лучше?" }
      tr: { text: "Picture Passport'ta {board}. seviyeyi {moves, plural, one {# hamlede} other {# hamlede}} bitirdim. Geçebilir misin?" }
      zh-Hans: { text: "我用{moves, plural, other {#步}}通关了 Picture Passport 第{board}关。你能用更少的步数吗？" }
    params:
      board: { type: integer, min: 1, max: 999 }
      moves: { type: integer, min: 1, max: 999 }
