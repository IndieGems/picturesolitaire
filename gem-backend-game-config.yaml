# picturesolitaire game config: data the game reads without a new build.
# Ship with: gemctl config upload --dry-run, then gemctl config upload --channel dev
# (the gemctl:game-config skill). `gemctl config schema` is the authority on fields.

save_schemas:
  # The UI's own slot (src/ui/progress.ts): presentation state the server does not
  # decide (which onboarding steps the player has seen). Its old campaign fields
  # (level, won, restored, best) are read ONCE by the win checker, to take in
  # progress made before "progress" below existed; nothing else reads them.
  - key: campaign
    access_self_read: true
    access_self_write: true
    access_game_server_read: true
    access_game_server_write: true
    max_size_bytes: 16384
  # The player's PROGRESS, owned by the server: the player reads it, and only the
  # win checker (functions/checker, progress.rs) writes it, after replaying a win.
  # The campaign position, wins, challenge bests, daily results (last ~100 days)
  # and restored pictures: a few KB at most.
  - key: progress
    access_self_read: true
    access_self_write: false
    access_game_server_read: true
    access_game_server_write: true
    max_size_bytes: 32768
  # Wins the checker has not answered yet (src/net/claims.ts), kept so a win made
  # just before the game closed is sent at the next start. The device's own word
  # and nothing more: the checker replays each claim and applies each claim id once.
  # At most 20 claims of a few KB each.
  - key: claims
    access_self_read: true
    access_self_write: true
    access_game_server_read: true
    access_game_server_write: false
    max_size_bytes: 131072

config:
  # The board's tuning (src/board/tuning.ts has the defaults, and what each one
  # does). One JSON text the board reads before its first deal; a key left out
  # keeps its default. Sizes are fractions of a card's width (the stacks' row and
  # the lift: of its height); times are milliseconds.
  #   helpers        Undo, Hint and Shuffle at the start of every board
  #   cardAspect     a card's width / height: 0.75 is the 3:4 portrait card (1 = square)
  #   gutter         the gap between cards
  #   frame          the pale frame round every picture, as a share of a card (thin: 0.025),
  #                  never under frameMin px
  #   stackRow       the stacks' row above the grid; stackGap the gap under it
  #   maxCard        the widest a card is drawn, in screen px, with a mouse (desktop)
  #   maxCardTouch   the same on a touch screen (phone, tablet): high, so the board fills its box
  #   tilt           the slight perspective (true) or straight-on (false)
  #   dragSlop       px a press travels before the piece follows the finger, 1:1
  #   tapSlop        px within which a press that stays on its own cell is still a tap
  #   liftTouch      how far a dragged piece rises above the finger (liftMouse: the pointer); 0 = none
  #   dragScale      a dragged piece's slight swell, about the finger; liftScale a tapped one's
  #   dropMs         a dropped piece settling; slideMs covered cards going back
  #   fallMs         a fall of one row
  #   dealStagger    THE refill stagger: from one dealt card to the next, left to right
  #   dealMs         one dealt card's drop from its stack
  #   mergePop       the pop when neighbours join (1.07 = 7% bigger), for mergePopMs
  #   completeGrow   a finished picture swells this much over completeGrowMs, twinkling,
  #                  holds completeHoldMs, then shrinks to nothing over completeLeaveMs;
  #                  completeStaggerMs between two finished at once; twinkles how many
  #   shuffleMs      Shuffle's cards trading places; hintMs the Hint's ghost flight
  board: |
    {
      "helpers": { "undo": 3, "hint": 3, "shuffle": 3 },
      "cardAspect": 0.75,
      "gutter": 0.08,
      "frame": 0.025,
      "frameMin": 2,
      "stackRow": 1.18,
      "stackGap": 0.2,
      "maxCard": 136,
      "maxCardTouch": 320,
      "tilt": false,
      "tiltDegrees": 8,
      "dragSlop": 3,
      "tapSlop": 10,
      "liftTouch": 0,
      "liftMouse": 0,
      "dragScale": 1.03,
      "liftScale": 1.06,
      "dropMs": 150,
      "slideMs": 240,
      "fallMs": 150,
      "dealStagger": 55,
      "dealMs": 280,
      "mergePop": 1.07,
      "mergePopMs": 260,
      "completeGrow": 1.06,
      "completeGrowMs": 140,
      "completeHoldMs": 90,
      "completeLeaveMs": 220,
      "completeStaggerMs": 60,
      "twinkles": 16,
      "shuffleMs": 460,
      "hintMs": 1300
    }

