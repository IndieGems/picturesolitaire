  # THE HELPER KIT: 3 of each helper, once ever, at the end of board 1 (the guided start),
  # or on the next win of a player already past it. The win checker pays it into the
  # helper currencies and sets this to 1 in the same order, so it is paid once or not at all.
  - id: a99673df-c47a-4837-b77a-d8420cdf74e3
    slug: helpers_kit
    display_name: "Helper kit"
    config:
      completion_threshold: 1
  # THE DAILY PUZZLE: one board a day, the same for everyone (src/content/levels/daily.json,
  # the board "d" + the date). The function checks the date is the player's own today,
  # posts moves and time to the "daily" board below, and completes this once a day.
  - id: 6d1f3b0e-8a52-4c7e-9f14-2b6e0d9a7c31
    slug: daily_picture
    display_name: "Today's picture"
    description: "Mend the day's picture: the same board for every player."
    config:
      completion_threshold: 1
      # local: an untimed puzzle compared among friends, so each player's own day is fair
      # enough, and nobody's daily turns over in the middle of their afternoon
      reset_schedule: { type: daily, boundary: local }
      platform_display: challenge
      function_may_grant: true
      platform_grants:
        - mode: on_complete
          amount: 50
          target: { platform_currency_slug: ARCADE_TICKETS }
  # THE DAILY ARCHIVE (docs/vip.md): a VIP's first verified win of a past day in the archive (this
  # month and the two before, with a day of slack) adds one day here, which pays that day's Coins,
  # once (the checker's record says which days were paid). Only the win checker writes it.
  - id: 795d5832-be77-44b1-a949-6ae8ec1c629d
    slug: daily_archive
