# A daily result, posted by the function once it has replayed the win: the
# player's first verified result of the day (one run id per player per date).
run_types:
  - id: daily_result
    int_value_1_name: moves
    int_value_2_name: time_ms
    challenge: 6d1f3b0e-8a52-4c7e-9f14-2b6e0d9a7c31

# The day's results, for comparing with friends (gem.leaderboards.friends): fewest
# moves first, then the quicker time. One board per date (per_period).
leaderboards:
  - id: daily
    run_type: daily_result
    order_by:
      - { column: int_value_1, direction: asc }
      - { column: int_value_2, direction: asc }
    per_period: true
    max_size: 100
    update_frequency_seconds: 300

