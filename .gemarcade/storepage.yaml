# storepage.yaml — store-page schema v3 (scaffolded by `gemctl store init`).
# Art: built by tools/art/store.py (hero/, borders/); the hover loop is video/preview.mp4.
# Check with `gemctl store upload --dry-run`. Nothing here is uploaded until someone runs the upload.

schema_version: 3

title: "Picture Passport"

tagline: "Piece the world together"

short_description: "Swap scattered cards until each picture is whole. Every board hides a real place, from Iguazú Falls to a giant banana: finish it and it unfolds into a postcard. Travel the world trip by trip and fill your passport, with no timers."

description: |
  ## Piece the pictures together

  Cards from several pictures lie scattered across the table. Drag one card onto another to swap them, or tap one and then the other. When a card meets its true neighbour, the two join into one piece and move together. Finish a picture and it clears, and new cards drop in from the stacks above.

  ## A real place on every board

  Each board hides one destination. Finish it and it unfolds into a postcard of the whole place, with its name: famous sights like Mont-Saint-Michel and the Sydney Harbour Bridge, hidden gems like Hutt Lagoon's pink lake, and roadside wonders like Lucy the Elephant.

  ## Travel the world

  Boards come in trips of 15: America, Japan, Italy, the American West, France, Canada, Argentina, Australia and more. Finish a trip and your passport gets its stamp. Boards grow as you go, from small tables to big 5×5 and 6×6 finales.

  ## Play at your own pace

  - **No timers and no move limits.** Every board can be won without help, and Restart is always free.
  - **Hard and super hard boards are marked**, with easier boards in between.
  - **Helpers when you want them.** Start with a travel kit of Undos, Hints and Shuffles. Earn more on hard boards, at the end of each trip and from the daily puzzle, or buy them with Coins.
  - **A daily puzzle**: the same board for everyone, every day.

feature_bullets:
  - "Swap cards to piece together photographs and paintings"
  - "A real place on every board, unfolding into a postcard when you finish it"
  - "Famous sights, hidden gems and roadside oddities around the world"
  - "Trips of 15 boards, each ending in a passport stamp"
  - "No timers and no move limits: every board can be won without help"
  - "A daily puzzle, the same for everyone"

# Played on phones (portrait) and desktop browsers throughout. Tablets: QA played every screen
# at 768x1024, 820x1180 and 1024x1366 (portrait, touch) with no faults; on the largest the board
# stops growing at its card cap and leaves empty table. Never tried on a TV.
form_factors:
  phone: full
  tablet: full
  desktop: full
  tv: none

input_methods:
  touch: full
  kb_mouse: full
  gamepad: none

# Portrait-only (AGENTS.md ruling): a PC or TV letterboxes the game between the portrait borders.
orientations:
  phone:
    portrait: full
    landscape: none
  tablet:
    portrait: full
    landscape: none

modes:
  singleplayer: { min: 1, max: 1 }

accessibility: []

metadata:
  languages:
    - { code: en, interface: true }

tags:
