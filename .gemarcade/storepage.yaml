        ko: "완성된 여행지가 레벨을 덮는 몽생미셸의 회화풍 엽서로 펼쳐지고, 위에는 이름과 프랑스 노르망디가 적혀 있어요."
        pl: "Ukończony cel podróży rozłożony w malowaną pocztówkę Mont-Saint-Michel, która zakrywa poziom, a nad nią nazwa i Normandia, Francja."
        pt-BR: "Um destino completo, aberto em um cartão-postal pintado do Mont-Saint-Michel que cobre o nível, com o nome e Normandia, França acima."
        ru: "Собранное место назначения развернулось в живописную открытку с Мон-Сен-Мишель, закрывающую уровень, а над ней название и «Нормандия, Франция»."
        tr: "Tamamlanan bir varış noktası, seviyeyi kaplayan tablo gibi bir Mont-Saint-Michel kartpostalına açılmış; üstünde adı ve Normandiya, Fransa yazıyor."
        zh-Hans: "完成的目的地展开成一张覆盖整个关卡的圣米歇尔山绘画风明信片，上方是地名和“法国诺曼底”。"
    - src: screenshots/04-passport-stamp.jpg
      alt:
        en: "The passport open at the American West trip: its stamp, 15 of 15 places visited, a button to play its Souvenir, and painted postcards of Bixby Bridge, Emerald Bay and Mono Lake."
        de: "Der Reisepass, aufgeschlagen bei der Reise durch den amerikanischen Westen: ihr Stempel, 15 von 15 besuchten Orten, eine Schaltfläche, um ihr Souvenir zu spielen, und gemalte Postkarten der Bixby Bridge, der Emerald Bay und des Mono Lake."
        es: "El pasaporte abierto en el viaje por el Oeste americano: su sello, 15 de 15 lugares visitados, un botón para jugar su Recuerdo y postales pintadas del puente Bixby, Emerald Bay y el lago Mono."
        fr: "Le passeport ouvert au voyage Ouest américain : son tampon, 15 lieux visités sur 15, un bouton pour jouer son Souvenir, et des cartes postales peintes du pont Bixby, d'Emerald Bay et du lac Mono."
        it: "Il passaporto aperto sul viaggio Ovest americano: il suo timbro, 15 luoghi visitati su 15, un pulsante per giocare il suo Souvenir e cartoline dipinte del Bixby Bridge, di Emerald Bay e del lago Mono."
        ja: "アメリカ西部の旅のページを開いたパスポート。スタンプ、15か所中15か所訪問済みの表示、おみやげで遊ぶボタン、ビクスビー・ブリッジ、エメラルド・ベイ、モノ湖の絵画風の絵はがき。"
        ko: "미국 서부 여행 페이지를 펼친 여권. 스탬프, 15곳 중 15곳 방문, 기념품을 플레이하는 버튼, 그리고 빅스비 브리지, 에메랄드 베이, 모노 호의 회화풍 엽서."
        pl: "Paszport otwarty na podróży Zachód USA: jej pieczątka, 15 z 15 odwiedzonych miejsc, przycisk do zagrania w jej Pamiątkę oraz malowane pocztówki mostu Bixby, Emerald Bay i jeziora Mono."
        pt-BR: "O passaporte aberto na viagem Oeste americano: o carimbo, 15 de 15 lugares visitados, um botão para jogar a Lembrança e cartões-postais pintados da Ponte Bixby, de Emerald Bay e do Lago Mono."
        ru: "Паспорт, открытый на путешествии «Американский Запад»: его штамп, 15 из 15 посещённых мест, кнопка, чтобы сыграть его Сувенир, и живописные открытки с мостом Биксби, заливом Эмералд-Бей и озером Моно."
        tr: "Amerikan Batısı gezisinde açık pasaport: damgası, 15 yerden 15'i ziyaret edildi, Hatırasını oynamak için bir düğme ve Bixby Köprüsü, Emerald Koyu ile Mono Gölü'nün tablo gibi kartpostalları."
        zh-Hans: "护照翻到美国西部之旅：它的印章、已到访 15/15 个地方、一个玩它的纪念品关卡的按钮，以及比克斯比大桥、翡翠湾和莫诺湖的绘画风明信片。"
    - src: screenshots/05-board-6x6.jpg
      alt:
        en: "A 6 by 6 level marked Super hard, with thirty-six picture cards and a carousel horse partly pieced together."
        de: "Ein 6×6-Level mit der Markierung Superschwer, mit sechsunddreißig Bildkarten und einem Karussellpferd, das teilweise zusammengesetzt ist."
        es: "Un nivel de 6 por 6 marcado como Superdifícil, con treinta y seis cartas con imágenes y un caballo de carrusel parcialmente montado."
        fr: "Un niveau de 6 sur 6 marqué Très difficile, avec trente-six cartes d'images et un cheval de manège en partie reconstitué."
        it: "Un livello 6 per 6 segnato come Difficilissimo, con trentasei carte illustrate e un cavallo da giostra in parte ricomposto."
        ja: "「超むずかしい」の印がついた6×6のレベル。36枚の絵のカードがあり、メリーゴーラウンドの木馬が一部つながっています。"
        ko: "매우 어려움 표시가 붙은 6×6 레벨. 그림 카드 36장이 있고 회전목마 말이 일부 맞춰져 있어요."
        pl: "Poziom 6 na 6 oznaczony jako Bardzo trudny, z trzydziestoma sześcioma kartami z obrazami i częściowo ułożonym konikiem z karuzeli."
        pt-BR: "Um nível 6 por 6 marcado como Superdifícil, com trinta e seis cartas com imagens e um cavalo de carrossel parcialmente montado."
        ru: "Уровень 6 на 6 с отметкой «Очень сложный», с тридцатью шестью картами и частично собранной лошадкой с карусели."
        tr: "Çok zor olarak işaretlenmiş 6'ya 6'lık bir seviye; otuz altı resimli kart ve kısmen birleştirilmiş bir atlıkarınca atı."
        zh-Hans: "标记为超难的 6×6 关卡，有三十六张图画卡牌，一匹旋转木马已部分拼好。"
    - src: screenshots/06-win-card.jpg
      alt:
        en: "The win card for a hard level: a finished painting of a lavender field beside the level's other pictures, 35 moves in 3 minutes, plus 40 Coins, one Undo and one Hint."
        de: "Die Gewinnkarte eines schweren Levels: ein fertiges Gemälde eines Lavendelfelds neben den anderen Bildern des Levels, 35 Züge in 3 Minuten, dazu 40 Münzen, ein Rückgängig und ein Tipp."
        es: "La tarjeta de victoria de un nivel difícil: una pintura terminada de un campo de lavanda junto a las demás imágenes del nivel, 35 movimientos en 3 minutos, más 40 monedas, un Deshacer y una Pista."
        fr: "La carte de victoire d'un niveau difficile : une peinture terminée d'un champ de lavande à côté des autres images du niveau, 35 coups en 3 minutes, plus 40 pièces, un Annuler et un Indice."
        it: "La schermata di vittoria di un livello difficile: un dipinto completato di un campo di lavanda accanto alle altre immagini del livello, 35 mosse in 3 minuti, più 40 monete, un Annulla e un Suggerimento."
        ja: "むずかしいレベルのクリア画面。完成したラベンダー畑の絵がそのレベルのほかの絵と並び、35手・3分、さらに40コイン、「元に戻す」1つ、「ヒント」1つ。"
        ko: "어려움 레벨의 승리 카드. 완성된 라벤더 밭 그림이 그 레벨의 다른 그림들 옆에 있고, 35수 3분, 그리고 40코인, 되돌리기 1개, 힌트 1개."
        pl: "Karta wygranej trudnego poziomu: ukończony obraz pola lawendy obok pozostałych obrazów poziomu, 35 ruchów w 3 minuty, a do tego 40 monet, jedno Cofnij i jedna Podpowiedź."
        pt-BR: "A tela de vitória de um nível difícil: uma pintura completa de um campo de lavanda ao lado das outras imagens do nível, 35 jogadas em 3 minutos, mais 40 moedas, um Desfazer e uma Dica."
        ru: "Карточка победы сложного уровня: готовая картина с лавандовым полем рядом с другими картинками уровня, 35 ходов за 3 минуты, а также 40 монет, одна Отмена и одна Подсказка."
        tr: "Zor bir seviyenin kazanma kartı: seviyenin diğer resimlerinin yanında tamamlanmış bir lavanta tarlası tablosu, 3 dakikada 35 hamle, ayrıca 40 jeton, bir Geri Al ve bir İpucu."
        zh-Hans: "困难关卡的胜利卡：完成的薰衣草田画作和该关的其他图画并排，3 分钟 35 步，另得 40 金币、一个撤销和一个提示。"
