# storepage.yaml — store-page schema v3 (scaffolded by `gemctl store init`).
# Art: built by tools/art/store.py (hero/, borders/); the hover loop is video/preview.mp4.
# Check with `gemctl store upload --dry-run`. Nothing here is uploaded until someone runs the upload.

schema_version: 3

title: "Picture Passport"

tagline: "Piece the world together"

short_description: "Swap scattered cards until each picture is whole. Every board hides a real place, from the Grand Canyon to the world's largest ball of twine: finish it and it unfolds into a postcard. Fill your passport trip by trip, with no timers."

description: |
  ## Piece the pictures together

  Cards from several pictures lie scattered across the table. Drag one card onto another to swap them, or tap one and then the other. When a card meets its true neighbour, the two join into one piece and move together. Finish a picture and it clears, and new cards drop in from the stacks above.

  ## A real place on every board

  Each board hides one destination. Finish it and it unfolds into a postcard of the whole place, with its name: famous sights like Niagara Falls and Yosemite, hidden gems like Letchworth State Park, and roadside wonders like Lucy the Elephant.

  ## Fill your passport

  Boards come in trips of 15, starting with Travel America, with Japan next. Every place you visit goes in your passport, and finishing a trip stamps it. How many have you been to for real?

  ## Play at your own pace

  - **No timers and no move limits.** Every board can be won without help, and undo, hint and shuffle are there when you want them.
  - **Hard and super hard boards are marked**, with easier boards in between.
  - **A daily puzzle**: the same board for everyone each day, to compare with friends.

feature_bullets:
  - "Swap cards to piece together photographs and paintings"
  - "A real place on every board, unfolding into a postcard when you finish it"
  - "Famous sights, hidden gems and roadside oddities"
  - "Fill your passport trip by trip, from Travel America to Japan"
  - "No timers and no move limits: every board can be won without help"
  - "A daily puzzle, the same for everyone, to compare with friends"

# Played on phones (portrait) and desktop browsers throughout. Tablets: QA played every screen
# at 768x1024, 820x1180 and 1024x1366 (portrait, touch) with no faults; on the largest the board
# stops growing at its card cap and leaves empty table. Never tried on a TV.
form_factors:
  phone: full
  tablet: full
  desktop: full
  tv: none

input_methods:
  touch: full
  kb_mouse: full
  gamepad: none

# Portrait-only (AGENTS.md ruling): a PC or TV letterboxes the game between the portrait borders.
orientations:
  phone:
    portrait: full
    landscape: none
  tablet:
    portrait: full
    landscape: none

modes:
  singleplayer: { min: 1, max: 1 }

accessibility: []

metadata:
  languages:
    - { code: en, interface: true }

tags:
  - play-puzzle-brain
  - play-cards-board
  - sub-hidden-object-jigsaw
  - puzzle
  - solitaire
  - jigsaw
  - relaxing
  - art
