short_description:
  en: "Swap scattered cards until each picture is whole. Every level hides a real place, from Iguazú Falls to a giant banana: finish it and it unfolds into a painted postcard. Travel the world trip by trip and fill your passport, with no timers."
  de: "Tausche verstreute Karten, bis jedes Bild vollständig ist. Jedes Level versteckt einen echten Ort, von den Iguazú-Wasserfällen bis zu einer Riesenbanane: Setz es zusammen, und es entfaltet sich zur gemalten Postkarte. Bereise die Welt Etappe für Etappe und füll deinen Reisepass, ohne Zeitlimit."
  es: "Intercambia cartas dispersas hasta completar cada imagen. Cada nivel esconde un lugar real, desde las cataratas del Iguazú hasta un plátano gigante: complétalo y se despliega en una postal pintada. Recorre el mundo viaje a viaje y llena tu pasaporte, sin cronómetros."
  fr: "Échangez les cartes éparpillées jusqu'à reconstituer chaque image. Chaque niveau cache un lieu réel, des chutes d'Iguazú à une banane géante : terminez-le et il se déplie en carte postale peinte. Parcourez le monde voyage après voyage et remplissez votre passeport, sans chrono."
  it: "Scambia le carte sparse finché ogni immagine è completa. Ogni livello nasconde un luogo reale, dalle cascate dell'Iguazú a una banana gigante: completalo e si apre in una cartolina dipinta. Gira il mondo un viaggio alla volta e riempi il tuo passaporto, senza timer."
  ja: "散らばったカードを入れ替えて、絵を完成させよう。どのレベルにも実在の場所が隠れています。イグアスの滝から巨大バナナまで、完成させると絵画風の絵はがきが広がります。旅をひとつずつめぐって、パスポートを埋めよう。時間制限はありません。"
  ko: "흩어진 카드를 바꿔 가며 그림을 완성하세요. 모든 레벨에는 실제 장소가 숨어 있어요. 이구아수 폭포부터 거대한 바나나까지, 완성하면 회화풍 엽서로 펼쳐져요. 여행을 하나씩 떠나며 여권을 채워 보세요. 시간 제한은 없어요."
  pl: "Zamieniaj rozrzucone karty, aż każdy obraz będzie cały. Każdy poziom kryje prawdziwe miejsce, od wodospadów Iguazú po gigantycznego banana: ułóż je, a rozłoży się w malowaną pocztówkę. Podróżuj po świecie etap po etapie i zapełniaj paszport, bez limitu czasu."
  pt-BR: "Troque as cartas espalhadas até completar cada imagem. Cada nível esconde um lugar real, das Cataratas do Iguaçu a uma banana gigante: complete-o e ele se abre em um cartão-postal pintado. Viaje pelo mundo uma viagem de cada vez e encha seu passaporte, sem cronômetro."
  ru: "Меняйте местами разбросанные карты, пока каждая картинка не станет целой. На каждом уровне спрятано реальное место, от водопадов Игуасу до гигантского банана: соберите его, и оно развернётся в живописную открытку. Путешествуйте по миру и заполняйте паспорт, без всяких таймеров."
  tr: "Dağınık kartların yerlerini değiştirerek her resmi tamamla. Her seviyede gerçek bir yer saklı; Iguazú Şelaleleri'nden dev bir muza kadar. Tamamladığında tablo gibi bir kartpostal olarak açılır. Dünyayı gezi gezi dolaş ve pasaportunu doldur, süre sınırı olmadan."
  zh-Hans: "交换散落的卡牌，直到每幅画完整呈现。每一关都藏着一个真实的地方，从伊瓜苏瀑布到一根巨型香蕉：完成它，就会展开成一张绘画风明信片。一段段旅行环游世界，集满你的护照，没有时间限制。"

description:
  en: |
    ## Piece the pictures together

    Cards from several pictures lie scattered across the table. Drag one card onto another to swap them, or tap one and then the other. When a card meets its true neighbour, the two join into one piece and move together. Finish a picture and it clears, and new cards drop in from the stacks above.

    ## A real place on every level

    Each level hides one destination. Finish it and it unfolds into a painted postcard of the whole place, with its name: famous sights like Mont-Saint-Michel and the Sydney Harbour Bridge, hidden gems like Hutt Lagoon's pink lake, and roadside wonders like Lucy the Elephant.

    ## Travel the world

    Levels come in trips of 15: America, Japan, Italy, the American West, France, Canada, Argentina, Australia, South Africa, and the UK and Ireland. Finish a trip and your passport gets its stamp. Levels grow as you go, from small grids to big 5×5 and 6×6 finales.

    ## A Souvenir after every trip

    Each stamp opens a Souvenir: a bonus level themed on the trip you just finished, like Japan's woodblock prints or France's Impressionist paintings. Win it to add its sticker to your passport.

    ## Pack the monthly suitcase

    Every month brings a themed suitcase to fill, like November's Ski Trip. Each day's puzzle hides one travel item: finish it and it's packed. Items come back on different days, so spares are never wasted: swap three for one you're missing. Fill the suitcase to win that month's themed table.

    ## Challenge a friend

    After a level or the daily puzzle, challenge an Arcade friend to beat your moves on the same level, or share a link with anyone. They can play it even before they reach it on their own trip.

    ## Play at your own pace

    - **No timers and no move limits.** Every level can be won without help, and Restart is always free.
    - **Hard and super hard levels are marked**, with easier levels in between.
    - **Helpers when you want them.** Start with a travel kit of Undos, Hints and Shuffles. Earn more on hard levels, at the end of each trip and from the daily puzzle, or buy them with Coins.
    - **A daily puzzle**: the same level for everyone, every day.

  de: |
    ## Setz die Bilder zusammen

    Karten aus mehreren Bildern liegen verstreut auf dem Tisch. Zieh eine Karte auf eine andere, um die beiden zu tauschen, oder tippe erst die eine und dann die andere an. Trifft eine Karte auf ihren echten Nachbarn, verbinden sich die beiden zu einem Teil und bewegen sich gemeinsam. Ist ein Bild fertig, verschwindet es, und neue Karten rücken von den Stapeln darüber nach.

    ## Ein echter Ort in jedem Level

    Jedes Level versteckt ein Reiseziel. Setzt du es zusammen, entfaltet es sich zu einer gemalten Postkarte des ganzen Ortes, mit seinem Namen: berühmte Sehenswürdigkeiten wie der Mont-Saint-Michel und die Sydney Harbour Bridge, Geheimtipps wie der rosa See der Hutt Lagoon und Kuriositäten am Straßenrand wie die Elefantin Lucy.

    ## Reise um die Welt

    Die Level kommen in Reisen zu je 15: Amerika, Japan, Italien, der amerikanische Westen, Frankreich, Kanada, Argentinien, Australien, Südafrika sowie Großbritannien & Irland. Schließ eine Reise ab, und dein Reisepass bekommt seinen Stempel. Die Level wachsen mit, von kleinen Rastern bis zu großen Finalleveln mit 5×5 und 6×6 Karten.

    ## Ein Souvenir nach jeder Reise

    Jeder Stempel öffnet ein Souvenir: ein Bonuslevel zum Thema der Reise, die du gerade beendet hast, etwa japanische Holzschnitte oder Gemälde des französischen Impressionismus. Gewinne es, und sein Sticker kommt in deinen Reisepass.

    ## Pack den Monatskoffer

    Jeden Monat gibt es einen Themenkoffer zu füllen, etwa den „Skiurlaub“ im November. Das Rätsel jedes Tages versteckt einen Reisegegenstand: Löst du es, ist er eingepackt. Gegenstände kommen an anderen Tagen wieder, deshalb ist kein doppelter verschwendet: Tausche drei gegen einen, der dir noch fehlt. Füll den Koffer, um den Thementisch des Monats zu gewinnen.

    ## Fordere Freunde heraus

    Nach einem Level oder dem Tagesrätsel kannst du Arcade-Freunde herausfordern, deine Züge im selben Level zu schlagen, oder einen Link mit allen teilen, die du willst. Sie können es spielen, noch bevor sie es auf ihrer eigenen Reise erreichen.

    ## Spiel in deinem Tempo

    - **Keine Zeitlimits und keine Zuglimits.** Jedes Level ist ohne Hilfe zu schaffen, und Neustart ist immer kostenlos.
    - **Schwere und superschwere Level sind markiert**, mit leichteren Leveln dazwischen.
    - **Hilfen, wenn du sie willst.** Du startest mit einem Reiseset aus Rückgängig, Tipp und Mischen. Mehr davon bekommst du in schweren Leveln, am Ende jeder Reise und durch das Tagesrätsel, oder du kaufst sie mit Münzen.
    - **Ein Tagesrätsel**: jeden Tag dasselbe Level für alle.

  es: |
    ## Une las imágenes

    Hay cartas de varias imágenes repartidas por la mesa. Arrastra una carta sobre otra para intercambiarlas, o toca una y luego la otra. Cuando una carta encuentra a su verdadera vecina, las dos se unen en una sola pieza y se mueven juntas. Completa una imagen y desaparece, y caen cartas nuevas desde los montones de arriba.

    ## Un lugar real en cada nivel

    Cada nivel esconde un destino. Complétalo y se despliega en una postal pintada del lugar entero, con su nombre: lugares famosos como el Mont-Saint-Michel y el puente de la bahía de Sídney, joyas escondidas como el lago rosa de la laguna Hutt y curiosidades de carretera como la elefanta Lucy.

    ## Viaja por el mundo

    Los niveles llegan en viajes de 15: Estados Unidos, Japón, Italia, el Oeste americano, Francia, Canadá, Argentina, Australia, Sudáfrica, y Reino Unido e Irlanda. Termina un viaje y tu pasaporte recibe su sello. Los niveles crecen a medida que avanzas, desde cuadrículas pequeñas hasta grandes finales de 5×5 y 6×6.

    ## Un Recuerdo después de cada viaje

    Cada sello abre un Recuerdo: un nivel extra dedicado al viaje que acabas de terminar, como los grabados japoneses en madera o la pintura impresionista francesa. Gánalo para añadir su pegatina a tu pasaporte.

    ## Llena la maleta del mes

    Cada mes trae una maleta temática que llenar, como el Viaje de esquí de noviembre. El puzle de cada día esconde un objeto de viaje: complétalo y quedará guardado. Los objetos vuelven otros días, así que los repetidos nunca se desperdician: cambia tres por uno que te falte. Llena la maleta para ganar la mesa temática de ese mes.

    ## Reta a un amigo

    Después de un nivel o del puzle diario, reta a un amigo del Arcade a superar tus movimientos en el mismo nivel, o comparte un enlace con quien quieras. Podrá jugarlo incluso antes de llegar a él en su propio viaje.

    ## Juega a tu ritmo

    - **Sin cronómetros ni límite de movimientos.** Todos los niveles se pueden ganar sin ayuda, y Reiniciar siempre es gratis.
    - **Los niveles difíciles y superdifíciles están marcados**, con niveles más fáciles entre ellos.
    - **Ayudas cuando las quieras.** Empieza con un kit de viaje de Deshacer, Pista y Mezclar. Consigue más en los niveles difíciles, al final de cada viaje y con el puzle diario, o cómpralas con monedas.
    - **Un puzle diario**: el mismo nivel para todos, cada día.

  fr: |
    ## Reconstituez les images

    Des cartes de plusieurs images sont éparpillées sur la table. Faites glisser une carte sur une autre pour les échanger, ou touchez l'une puis l'autre. Quand une carte rencontre sa vraie voisine, les deux se joignent en une seule pièce et se déplacent ensemble. Terminez une image et elle disparaît, puis de nouvelles cartes tombent des piles du dessus.

    ## Un lieu réel à chaque niveau

    Chaque niveau cache une destination. Terminez-la et elle se déplie en une carte postale peinte du lieu entier, avec son nom : des sites célèbres comme le Mont-Saint-Michel et le Harbour Bridge de Sydney, des trésors cachés comme le lac rose de Hutt Lagoon, et des curiosités du bord de la route comme l'éléphante Lucy.

    ## Faites le tour du monde

    Les niveaux forment des voyages de 15 : États-Unis, Japon, Italie, Ouest américain, France, Canada, Argentine, Australie, Afrique du Sud, et Royaume-Uni et Irlande. Terminez un voyage et votre passeport reçoit son tampon. Les niveaux grandissent au fil du jeu, des petites grilles jusqu'aux grandes finales en 5×5 et 6×6.

    ## Un Souvenir après chaque voyage

    Chaque tampon ouvre un Souvenir : un niveau bonus sur le thème du voyage que vous venez de terminer, comme les estampes japonaises ou la peinture impressionniste française. Gagnez-le pour coller son autocollant dans votre passeport.

    ## Remplissez la valise du mois

    Chaque mois apporte une valise à thème à remplir, comme les Vacances au ski de novembre. Le puzzle de chaque jour cache un objet de voyage : terminez-le et il est rangé. Les objets reviennent d'autres jours, donc les doubles ne sont jamais perdus : échangez-en trois contre celui qui vous manque. Remplissez la valise pour gagner la table à thème du mois.

    ## Défiez un ami

    Après un niveau ou le puzzle du jour, défiez un ami de l'Arcade de battre votre nombre de coups sur le même niveau, ou partagez un lien avec qui vous voulez. Il peut y jouer avant même de l'atteindre dans son propre voyage.

    ## Jouez à votre rythme

    - **Pas de chrono ni de limite de coups.** Chaque niveau peut être gagné sans aide, et Recommencer est toujours gratuit.
    - **Les niveaux difficiles et très difficiles sont signalés**, avec des niveaux plus faciles entre eux.
    - **Des bonus quand vous voulez.** Commencez avec un kit de voyage de bonus : Annuler, Indice et Mélanger. Gagnez-en plus dans les niveaux difficiles, à la fin de chaque voyage et avec le puzzle du jour, ou achetez-les avec des pièces.
    - **Un puzzle du jour** : le même niveau pour tous, chaque jour.

  it: |
    ## Ricomponi le immagini

    Le carte di diverse immagini sono sparse sul tavolo. Trascina una carta su un'altra per scambiarle, oppure tocca prima l'una e poi l'altra. Quando una carta incontra la sua vera vicina, le due si uniscono in un solo pezzo e si muovono insieme. Completa un'immagine e sparisce, e nuove carte scendono dalle pile in alto.

    ## Un luogo reale in ogni livello

    Ogni livello nasconde una destinazione. Completala e si apre in una cartolina dipinta dell'intero luogo, con il suo nome: luoghi famosi come Mont-Saint-Michel e il Sydney Harbour Bridge, gioielli nascosti come il lago rosa di Hutt Lagoon e stranezze lungo la strada come l'elefantessa Lucy.

    ## Gira il mondo

    I livelli sono raccolti in viaggi da 15: America, Giappone, Italia, Ovest americano, Francia, Canada, Argentina, Australia, Sudafrica, e Regno Unito e Irlanda. Finisci un viaggio e il tuo passaporto riceve il suo timbro. I livelli crescono man mano, dalle griglie piccole fino ai grandi finali 5×5 e 6×6.

    ## Un Souvenir dopo ogni viaggio

    Ogni timbro apre un Souvenir: un livello bonus a tema con il viaggio appena concluso, come le stampe giapponesi su legno o la pittura impressionista francese. Vincilo per aggiungere il suo adesivo al tuo passaporto.

    ## Riempi la valigia del mese

    Ogni mese arriva una valigia a tema da riempire, come la Settimana bianca di novembre. Il puzzle di ogni giorno nasconde un oggetto da viaggio: completalo e finisce in valigia. Gli oggetti tornano in altri giorni, quindi i doppioni non vanno mai sprecati: scambiane tre con uno che ti manca. Riempi la valigia per vincere il tavolo a tema del mese.

    ## Sfida un amico

    Dopo un livello o il puzzle del giorno, sfida un amico dell'Arcade a battere le tue mosse sullo stesso livello, oppure condividi un link con chi vuoi. Potrà giocarlo anche prima di arrivarci nel suo viaggio.

    ## Gioca al tuo ritmo

    - **Niente timer e nessun limite di mosse.** Ogni livello si può vincere senza aiuti, e Ricomincia è sempre gratis.
    - **I livelli difficili e difficilissimi sono segnalati**, con livelli più facili nel mezzo.
    - **Aiuti quando vuoi.** Inizi con un kit da viaggio di aiuti: Annulla, Suggerimento e Mescola. Ne guadagni altri nei livelli difficili, alla fine di ogni viaggio e con il puzzle del giorno, oppure li compri con le monete.
    - **Un puzzle del giorno**: lo stesso livello per tutti, ogni giorno.

  ja: |
    ## 絵をつなぎ合わせよう

    テーブルには、いくつもの絵のカードがばらばらに並んでいます。カードを別のカードにドラッグすると、2枚が入れ替わります。1枚ずつ順にタップしても入れ替えられます。正しいとなりのカードと並ぶと、2枚はひとつのピースにつながり、一緒に動きます。絵が完成すると消え、上の山札から新しいカードが落ちてきます。

    ## どのレベルにも本物の場所

    各レベルには目的地がひとつ隠れています。完成させると、その場所全体を描いた絵画風の絵はがきが、名前とともに広がります。モン・サン＝ミシェルやシドニー・ハーバーブリッジのような名所、ハット・ラグーンのピンクの湖のような穴場、象のルーシーのような道ばたの珍スポットまで。

    ## 世界をめぐろう

    レベルは15ずつの旅にまとまっています。アメリカ、日本、イタリア、アメリカ西部、フランス、カナダ、アルゼンチン、オーストラリア、南アフリカ、イギリスとアイルランド。旅を終えると、パスポートにスタンプが押されます。進むにつれてレベルは大きくなり、小さなマス目から5×5や6×6の大きなフィナーレまで登場します。

    ## 旅のあとにはおみやげ

    スタンプをもらうたびに、おみやげが開きます。終えたばかりの旅をテーマにしたボーナスレベルで、日本なら木版画、フランスなら印象派の絵画といった具合です。クリアすると、そのステッカーをパスポートに貼れます。

    ## 毎月のスーツケースを満たそう

    毎月、テーマつきのスーツケースが登場します。たとえば11月は「スキー旅行」。毎日のパズルには旅の持ち物がひとつ隠れていて、クリアするとスーツケースに入ります。持ち物は別の日にもまた出てくるので、ダブったものもむだになりません。3つを、足りないもの1つと交換できます。スーツケースがいっぱいになると、その月のテーマのテーブルがもらえます。

    ## フレンドに挑戦

    レベルやデイリーパズルのあとで、Arcadeのフレンドに「同じレベルで自分の手数を超えてみて」と挑戦したり、だれにでもリンクをシェアしたりできます。相手は、自分の旅でそのレベルにたどり着く前でも遊べます。

    ## 自分のペースで

    - **時間制限も手数制限もなし。** どのレベルもアイテムなしでクリアでき、「やり直す」はいつでも無料です。
    - **むずかしいレベルと超むずかしいレベルには印がつきます。** そのあいだには、やさしいレベルがはさまります。
    - **アイテムは使いたいときに。** 「元に戻す」「ヒント」「シャッフル」が入った旅のキットでスタート。むずかしいレベル、旅の終わり、デイリーパズルでもらえるほか、コインで買うこともできます。
    - **デイリーパズル**：毎日、全員が同じレベルに挑戦します。

  ko: |
    ## 그림을 맞춰 보세요

    테이블 위에 여러 그림의 카드가 흩어져 있어요. 카드를 다른 카드 위로 끌어 놓으면 서로 자리가 바뀌고, 한 장씩 차례로 탭해도 바꿀 수 있어요. 카드가 진짜 이웃 카드를 만나면 두 장이 한 조각으로 합쳐져 함께 움직여요. 그림을 완성하면 사라지고, 위쪽 더미에서 새 카드가 내려와요.

    ## 모든 레벨에 실제 장소가

    각 레벨에는 여행지가 하나씩 숨어 있어요. 완성하면 그곳 전체를 그린 회화풍 엽서가 이름과 함께 펼쳐져요. 몽생미셸과 시드니 하버 브리지 같은 명소, 헛 라군의 분홍 호수 같은 숨은 명소, 코끼리 루시 같은 길가의 별난 볼거리까지 만나 보세요.

    ## 세계를 여행하세요

    레벨은 15개씩 여행으로 묶여 있어요. 미국, 일본, 이탈리아, 미국 서부, 프랑스, 캐나다, 아르헨티나, 호주, 남아프리카, 영국과 아일랜드. 여행을 마치면 여권에 스탬프가 찍혀요. 진행할수록 레벨이 커져서, 작은 격자부터 5×5와 6×6의 큰 피날레까지 이어져요.

    ## 여행이 끝나면 기념품

    스탬프를 받을 때마다 기념품이 열려요. 방금 마친 여행을 테마로 한 보너스 레벨로, 일본은 목판화, 프랑스는 인상파 그림 같은 식이에요. 클리어하면 그 스티커를 여권에 붙일 수 있어요.

    ## 매달 여행 가방을 채우세요

    매달 테마가 있는 여행 가방이 찾아와요. 11월은 '스키 여행'이에요. 매일의 퍼즐에는 여행 물품이 하나씩 숨어 있고, 클리어하면 가방에 담겨요. 물품은 다른 날에도 다시 나오니 중복된 것도 버릴 일이 없어요. 세 개를 모자란 물품 하나와 바꿀 수 있어요. 가방을 가득 채우면 그달의 테마 테이블을 받아요.

    ## 친구에게 도전

    레벨이나 데일리 퍼즐을 마친 뒤, Arcade 친구에게 같은 레벨에서 내 수를 이겨 보라고 도전하거나, 누구에게나 링크를 공유할 수 있어요. 친구는 자기 여행에서 그 레벨에 닿기 전이라도 플레이할 수 있어요.

    ## 내 속도대로

    - **시간 제한도, 이동 횟수 제한도 없어요.** 모든 레벨은 아이템 없이 클리어할 수 있고, 다시 시작은 언제나 무료예요.
    - **어려움과 매우 어려움 레벨은 표시돼요.** 그 사이사이에 쉬운 레벨이 있어요.
    - **아이템은 원할 때.** 되돌리기, 힌트, 섞기가 든 여행 키트로 시작해요. 어려운 레벨, 여행의 끝, 데일리 퍼즐에서 더 얻거나 코인으로 살 수 있어요.
    - **데일리 퍼즐**: 매일 모두가 같은 레벨에 도전해요.

  pl: |
    ## Układaj obrazy

    Na stole leżą rozrzucone karty z kilku obrazów. Przeciągnij kartę na inną, aby je zamienić, albo dotknij jednej, a potem drugiej. Gdy karta trafi na swojego prawdziwego sąsiada, obie łączą się w jeden kawałek i poruszają się razem. Gotowy obraz znika, a ze stosów u góry spadają nowe karty.

    ## Prawdziwe miejsce na każdym poziomie

    Każdy poziom kryje jeden cel podróży. Ułóż go, a rozłoży się w malowaną pocztówkę całego miejsca, z jego nazwą: słynne zabytki, takie jak Mont-Saint-Michel i Sydney Harbour Bridge, ukryte perełki, jak różowe jezioro Hutt Lagoon, i przydrożne osobliwości, jak słonica Lucy.

    ## Podróżuj po świecie

    Poziomy tworzą podróże po 15: Ameryka, Japonia, Włochy, Zachód USA, Francja, Kanada, Argentyna, Australia, Afryka Południowa oraz Wielka Brytania i Irlandia. Ukończ podróż, a w paszporcie pojawi się pieczątka. Poziomy rosną w miarę gry, od małych siatek po wielkie finały 5×5 i 6×6.

    ## Pamiątka po każdej podróży

    Każda pieczątka otwiera Pamiątkę: poziom bonusowy poświęcony właśnie ukończonej podróży, na przykład japońskie drzeworyty albo francuskie obrazy impresjonistów. Wygraj go, aby wkleić jego naklejkę do paszportu.

    ## Spakuj walizkę miesiąca

    Co miesiąc czeka tematyczna walizka do zapełnienia, na przykład listopadowy „Wyjazd na narty”. Łamigłówka każdego dnia kryje jeden przedmiot podróżny: ułóż ją, a trafi on do walizki. Przedmioty wracają w inne dni, więc duplikaty nigdy się nie marnują: wymień trzy na jeden, którego brakuje. Zapełnij walizkę, aby zdobyć tematyczny stół tego miesiąca.

    ## Wyzwij znajomego

    Po poziomie lub łamigłówce dnia wyzwij znajomego z Arcade, by pobił twoją liczbę ruchów na tym samym poziomie, albo udostępnij link komukolwiek. Znajomy może zagrać w ten poziom, zanim jeszcze dotrze do niego w swojej podróży.

    ## Graj we własnym tempie

    - **Bez limitu czasu i bez limitu ruchów.** Każdy poziom da się wygrać bez pomocy, a „Od nowa” jest zawsze za darmo.
    - **Poziomy trudne i bardzo trudne są oznaczone**, a między nimi są łatwiejsze.
    - **Pomoce, kiedy chcesz.** Zaczynasz z podróżnym zestawem pomocy: Cofnij, Podpowiedź i Tasuj. Więcej zdobędziesz na trudnych poziomach, na końcu każdej podróży i w łamigłówce dnia, albo kupisz je za monety.
    - **Łamigłówka dnia**: ten sam poziom dla wszystkich, każdego dnia.

  pt-BR: |
    ## Monte as imagens

    Cartas de várias imagens estão espalhadas pela mesa. Arraste uma carta sobre outra para trocá-las, ou toque em uma e depois na outra. Quando uma carta encontra sua verdadeira vizinha, as duas se juntam em uma só peça e se movem juntas. Complete uma imagem e ela some, e novas cartas caem das pilhas de cima.

    ## Um lugar real em cada nível

    Cada nível esconde um destino. Complete-o e ele se abre em um cartão-postal pintado do lugar inteiro, com o nome: pontos famosos como o Mont-Saint-Michel e a Ponte da Baía de Sydney, joias escondidas como o lago cor-de-rosa de Hutt Lagoon e curiosidades de beira de estrada como a Elefanta Lucy.

    ## Viaje pelo mundo

    Os níveis vêm em viagens de 15: Estados Unidos, Japão, Itália, Oeste americano, França, Canadá, Argentina, Austrália, África do Sul, e Reino Unido e Irlanda. Termine uma viagem e seu passaporte ganha o carimbo. Os níveis crescem à medida que você avança, de grades pequenas a grandes finais 5×5 e 6×6.

    ## Uma Lembrança depois de cada viagem

    Cada carimbo abre uma Lembrança: um nível bônus com o tema da viagem que você acabou de terminar, como as xilogravuras japonesas ou a pintura impressionista francesa. Vença-o para colar o adesivo dele no seu passaporte.

    ## Arrume a mala do mês

    Todo mês traz uma mala temática para encher, como a Viagem de esqui de novembro. O quebra-cabeça de cada dia esconde um item de viagem: complete-o e o item vai para a mala. Os itens voltam em outros dias, então os repetidos nunca são desperdiçados: troque três por um que esteja faltando. Encha a mala para ganhar a mesa temática do mês.

    ## Desafie um amigo

    Depois de um nível ou do quebra-cabeça do dia, desafie um amigo do Arcade a bater suas jogadas no mesmo nível, ou compartilhe um link com quem quiser. Ele pode jogar mesmo antes de chegar a esse nível na própria viagem.

    ## Jogue no seu ritmo

    - **Sem cronômetro e sem limite de jogadas.** Todo nível pode ser vencido sem ajuda, e Reiniciar é sempre grátis.
    - **Os níveis difíceis e superdifíceis são marcados**, com níveis mais fáceis entre eles.
    - **Ajudas quando quiser.** Comece com um kit de viagem com Desfazer, Dica e Embaralhar. Ganhe mais nos níveis difíceis, no fim de cada viagem e no quebra-cabeça do dia, ou compre com moedas.
    - **Um quebra-cabeça do dia**: o mesmo nível para todos, todo dia.

  ru: |
    ## Собирайте картинки

    На столе разбросаны карты из нескольких картинок. Перетащите одну карту на другую, чтобы поменять их местами, или коснитесь сначала одной, а потом другой. Когда карта встречает своего настоящего соседа, они соединяются в одну деталь и двигаются вместе. Готовая картинка исчезает, а из стопок сверху падают новые карты.

    ## Реальное место на каждом уровне

    На каждом уровне спрятано одно место назначения. Соберите его, и оно развернётся в живописную открытку с этим местом целиком и его названием: знаменитые достопримечательности вроде Мон-Сен-Мишель и моста Харбор-Бридж в Сиднее, скрытые жемчужины вроде розового озера лагуны Хатт и придорожные диковинки вроде слонихи Люси.

    ## Путешествуйте по миру

    Уровни собраны в путешествия по 15: Америка, Япония, Италия, Американский Запад, Франция, Канада, Аргентина, Австралия, Южная Африка, а также Великобритания и Ирландия. Завершите путешествие, и в паспорте появится штамп. Уровни растут по ходу игры: от маленьких сеток до больших финалов 5×5 и 6×6.

    ## Сувенир после каждого путешествия

    Каждый штамп открывает Сувенир: бонусный уровень на тему только что завершённого путешествия, например японские гравюры на дереве или картины французских импрессионистов. Пройдите его и вклейте наклейку в паспорт.

    ## Соберите чемодан месяца

    Каждый месяц приносит тематический чемодан, который нужно заполнить, например ноябрьский «Лыжный отдых». Головоломка каждого дня прячет один дорожный предмет: решите её, и он отправится в чемодан. Предметы возвращаются в другие дни, поэтому повторы не пропадают: обменяйте три на тот, которого не хватает. Заполните чемодан, чтобы получить тематический стол этого месяца.

    ## Вызов другу

    После уровня или головоломки дня бросьте вызов другу из Arcade: пусть попробует пройти тот же уровень за меньшее число ходов. Или поделитесь ссылкой с кем угодно. Друг может сыграть, даже если ещё не дошёл до этого уровня в своём путешествии.

    ## Играйте в своём темпе

    - **Никаких таймеров и ограничений на ходы.** Любой уровень можно пройти без бонусов, а «Заново» всегда бесплатно.
    - **Сложные и очень сложные уровни отмечены**, а между ними идут уровни полегче.
    - **Бонусы, когда они нужны.** Вы начинаете с дорожным набором: Отмена, Подсказка и Перемешать. Ещё больше можно получить на сложных уровнях, в конце каждого путешествия и за головоломку дня или купить за монеты.
    - **Головоломка дня**: каждый день один и тот же уровень для всех.

  tr: |
    ## Resimleri birleştir

    Masada birkaç resmin kartları dağınık hâlde duruyor. Yerlerini değiştirmek için bir kartı diğerinin üstüne sürükle ya da önce birine, sonra diğerine dokun. Bir kart gerçek komşusuyla buluşunca ikisi tek bir parça olarak birleşir ve birlikte hareket eder. Tamamlanan resim kaybolur ve yukarıdaki destelerden yeni kartlar düşer.

    ## Her seviyede gerçek bir yer

    Her seviye bir varış noktası saklar. Onu tamamladığında, yerin tamamını gösteren tablo gibi bir kartpostal adıyla birlikte açılır: Mont-Saint-Michel ve Sidney Liman Köprüsü gibi ünlü yerler, Hutt Lagünü'nün pembe gölü gibi saklı cennetler ve Fil Lucy gibi yol kenarı tuhaflıkları.

    ## Dünyayı gez

    Seviyeler 15'lik gezilerde gelir: Amerika, Japonya, İtalya, Amerikan Batısı, Fransa, Kanada, Arjantin, Avustralya, Güney Afrika ile Birleşik Krallık ve İrlanda. Bir geziyi bitirdiğinde pasaportuna damgası basılır. Seviyeler ilerledikçe büyür; küçük ızgaralardan büyük 5×5 ve 6×6 finallere kadar.

    ## Her geziden sonra bir Hatıra

    Her damga bir Hatıra açar: az önce bitirdiğin geziye adanmış bir bonus seviye, örneğin Japon ağaç baskıları ya da Fransız empresyonist tabloları. Onu kazan ve çıkartmasını pasaportuna yapıştır.

    ## Ayın bavulunu hazırla

    Her ay doldurulacak temalı bir bavul gelir, örneğin kasımdaki “Kayak Tatili”. Her günün bulmacası bir seyahat eşyası saklar: bulmacayı çöz, eşya bavula girsin. Eşyalar başka günlerde yeniden çıkar, bu yüzden fazlalar asla boşa gitmez: üç tanesini eksik olan bir eşyayla takas et. Bavulu doldur ve o ayın temalı masasını kazan.

    ## Arkadaşına meydan oku

    Bir seviyeyi ya da günün bulmacasını bitirdikten sonra bir Arcade arkadaşına aynı seviyede hamle sayını geçmesi için meydan oku ya da bağlantıyı istediğin kişiyle paylaş. Arkadaşın, o seviyeye kendi gezisinde ulaşmadan da oynayabilir.

    ## Kendi hızında oyna

    - **Süre sınırı yok, hamle sınırı yok.** Her seviye yardım almadan kazanılabilir ve Yeniden başla her zaman ücretsizdir.
    - **Zor ve çok zor seviyeler işaretlidir**, aralarında daha kolay seviyeler vardır.
    - **İstediğinde yardımlar.** Geri Al, İpucu ve Karıştır'dan oluşan bir seyahat setiyle başlarsın. Zor seviyelerde, her gezinin sonunda ve günün bulmacasından daha fazlasını kazan ya da jetonla satın al.
    - **Günün bulmacası**: Her gün herkes için aynı seviye.

  zh-Hans: |
    ## 拼合图画

    桌面上散落着来自几幅图画的卡牌。把一张卡牌拖到另一张上即可交换，也可以先点一张、再点另一张。当卡牌碰到真正的相邻卡牌时，两张会合成一块，一起移动。拼完一幅画后它会消失，上方的牌堆会落下新的卡牌。

    ## 每一关都有真实的地方

    每一关都藏着一个目的地。完成它，就会展开成一张描绘整个地方的绘画风明信片，并附上地名：有圣米歇尔山和悉尼海港大桥这样的著名景点，有赫特潟湖粉色湖水这样的小众秘境，还有大象露西这样的路边奇观。

    ## 环游世界

    关卡以每 15 关为一段旅行：美国、日本、意大利、美国西部、法国、加拿大、阿根廷、澳大利亚、南非，以及英国和爱尔兰。完成一段旅行，护照上就会盖上印章。关卡会随着进度变大，从小网格一直到 5×5 和 6×6 的大型终局关卡。

    ## 每段旅行后都有纪念品

    每个印章都会开启一份纪念品：以刚刚完成的旅行为主题的奖励关卡，比如日本的木版画或法国的印象派绘画。赢下它，就能把它的贴纸贴进护照。

    ## 装满每月的行李箱

    每个月都有一个主题行李箱等你装满，比如十一月的“滑雪之旅”。每天的谜题都藏着一件旅行物品：完成谜题，物品就会装进箱子。物品会在不同的日子再次出现，所以重复的也不会浪费：三件可以换一件你还缺的。装满行李箱，就能赢得当月的主题桌面。

    ## 挑战好友

    完成一关或每日谜题后，你可以挑战一位 Arcade 好友，看谁能在同一关用更少的步数完成，也可以把链接分享给任何人。即使对方在自己的旅行中还没到那一关，也能先玩。

    ## 按自己的节奏玩

    - **没有时间限制，也没有步数限制。** 每一关都能不用道具完成，重新开始永远免费。
    - **困难和超难关卡都有标记**，中间穿插着更轻松的关卡。
    - **想用道具就用。** 一开始你就有一套旅行道具包：撤销、提示和洗牌。在困难关卡、每段旅行结束时和每日谜题中还能获得更多，也可以用金币购买。
    - **每日谜题**：每天所有人玩同一关。

