# storepage.yaml — store-page schema v3 (scaffolded by `gemctl store init`).
# Art: built by tools/art/store.py (hero/, borders/); the hover loop is video/preview.mp4.
# Check with `gemctl store upload --dry-run`. Nothing here is uploaded until someone runs the upload.
# Copy in the 12 Arcade locales (release review GSR-003, 2026-10-29): the words follow
# locales/glossary.md, shared with the game's text ("level", never "board"). The title is the
# game's name and stays English everywhere. A later pass translates only the fields that changed.

schema_version: 3

title: "Picture Passport"

