  screenshots:
    - src: screenshots/01-home-france.jpg
      alt:
        en: "Home on the sunny sky-blue table, on the France trip, stop 6 of 15: painted postcards of Étretat's cliffs, Mont-Saint-Michel, the pink granite coast, Allouville's chapel oak and Chenonceau, the America trip's Souvenir waiting, and the Next stop button."
        de: "Startbildschirm auf dem sonnigen himmelblauen Tisch, Frankreich-Reise, Station 6 von 15: gemalte Postkarten der Klippen von Étretat, des Mont-Saint-Michel, der Côte de Granit Rose, der Kapelleneiche von Allouville und von Chenonceau, das wartende Souvenir der Amerika-Reise und „Nächste Station“."
        es: "Inicio en la mesa soleada azul cielo, viaje por Francia, parada 6 de 15: postales pintadas de los acantilados de Étretat, el Mont-Saint-Michel, la costa de Granito Rosa, el roble capilla de Allouville y Chenonceau, el Recuerdo del viaje por Estados Unidos esperando y el botón Siguiente parada."
        fr: "Accueil sur la table ensoleillée bleu ciel, voyage en France, étape 6 sur 15 : cartes postales peintes des falaises d'Étretat, du Mont-Saint-Michel, de la côte de Granit rose, du chêne-chapelle d'Allouville et de Chenonceau, le Souvenir des États-Unis en attente et le bouton Étape suivante."
        it: "Schermata iniziale sul tavolo soleggiato, viaggio in Francia, tappa 6 di 15: cartoline dipinte delle scogliere di Étretat, di Mont-Saint-Michel, della Costa di Granito Rosa, della quercia cappella di Allouville e di Chenonceau, il Souvenir dell'America in attesa e il pulsante Prossima tappa."
        ja: "晴れた空色のテーブルのホーム画面。フランスの旅の15か所中6か所目で、エトルタの断崖、モン・サン＝ミシェル、ピンク花崗岩海岸、アルーヴィルの礼拝堂の樫、シュノンソーの絵画風の絵はがき、待っているアメリカの旅のおみやげ、「次の目的地」ボタン。"
        ko: "맑은 하늘색 테이블의 홈 화면. 프랑스 여행 15곳 중 6번째 장소로, 에트르타 절벽, 몽생미셸, 분홍 화강암 해안, 알루빌의 예배당 참나무, 슈농소의 회화풍 엽서, 기다리고 있는 미국 여행의 기념품, 다음 장소 버튼이 보여요."
        pl: "Ekran główny na słonecznym, błękitnym stole, podróż po Francji, przystanek 6 z 15: malowane pocztówki klifów Étretat, Mont-Saint-Michel, Wybrzeża Różowego Granitu, dębu-kaplicy w Allouville i Chenonceau, czekająca Pamiątka z podróży po Ameryce i przycisk Następny przystanek."
        pt-BR: "Tela inicial na mesa ensolarada azul-celeste, viagem pela França, parada 6 de 15: cartões-postais pintados das falésias de Étretat, do Mont-Saint-Michel, da Costa de Granito Rosa, do carvalho-capela de Allouville e de Chenonceau, a Lembrança dos Estados Unidos esperando e o botão Próxima parada."
        ru: "Главный экран на солнечном небесно-голубом столе, путешествие по Франции, остановка 6 из 15: живописные открытки со скалами Этрета, Мон-Сен-Мишель, Розовым гранитным берегом, дубом-часовней в Аллувиле и Шенонсо, ждущий Сувенир путешествия по Америке и кнопка «Следующая остановка»."
        tr: "Güneşli gök mavisi masada ana ekran, Fransa gezisi, 15 duraktan 6'ncısı: Étretat kayalıkları, Mont-Saint-Michel, Pembe Granit Kıyısı, Allouville şapel meşesi ve Chenonceau'nun tablo gibi kartpostalları, bekleyen Amerika gezisi Hatırası ve Sonraki durak düğmesi."
        zh-Hans: "晴朗天蓝色桌面上的主屏幕，法国之旅第 6 站（共 15 站）：埃特勒塔悬崖、圣米歇尔山、粉红花岗岩海岸、阿卢维尔礼拜堂橡树和舍农索的绘画风明信片，等待中的美国之旅纪念品，以及“下一站”按钮。"
    - src: screenshots/02-board-mid-play.jpg
      alt:
        en: "A 4 by 5 level in play on the sunny table. Picture cards fill the grid under stacks of face-up cards, and one picture, a red handcar, is partly joined into a larger piece. Restart, Undo, Hint and Shuffle buttons sit below."
        de: "Ein 4×5-Level im Spiel auf dem sonnigen Tisch. Bildkarten füllen das Raster unter Stapeln offener Karten, und ein Bild, eine rote Draisine, ist teilweise zu einem größeren Teil verbunden. Darunter liegen die Schaltflächen Neustart, Rückgängig, Tipp und Mischen."
        es: "Un nivel de 4 por 5 en juego sobre la mesa soleada. Las cartas con imágenes llenan la cuadrícula bajo montones de cartas boca arriba, y una imagen, una dresina roja, está parcialmente unida en una pieza más grande. Debajo están los botones Reiniciar, Deshacer, Pista y Mezclar."
        fr: "Un niveau de 4 sur 5 en cours sur la table ensoleillée. Des cartes d'images remplissent la grille sous des piles de cartes face visible, et une image, une draisine rouge, est en partie assemblée en une plus grande pièce. Les boutons Recommencer, Annuler, Indice et Mélanger sont en dessous."
        it: "Un livello 4 per 5 in corso sul tavolo soleggiato. Le carte illustrate riempiono la griglia sotto pile di carte scoperte, e un'immagine, un carrello ferroviario rosso, è in parte unita in un pezzo più grande. Sotto ci sono i pulsanti Ricomincia, Annulla, Suggerimento e Mescola."
        ja: "晴れたテーブルでプレイ中の4×5のレベル。表向きのカードの山の下で絵のカードがマス目を埋め、赤い手こぎトロッコの絵が一部つながって大きなピースになっています。下には「やり直す」「元に戻す」「ヒント」「シャッフル」のボタン。"
        ko: "맑은 테이블에서 플레이 중인 4×5 레벨. 앞면이 보이는 카드 더미 아래로 그림 카드가 격자를 채우고, 빨간 핸드카 그림 하나가 일부 합쳐져 큰 조각이 되어 있어요. 아래에는 다시 시작, 되돌리기, 힌트, 섞기 버튼이 있어요."
        pl: "Poziom 4 na 5 w trakcie gry na słonecznym stole. Karty z obrazami wypełniają siatkę pod stosami odkrytych kart, a jeden obraz, czerwona drezyna, jest częściowo połączony w większy kawałek. Pod spodem są przyciski Od nowa, Cofnij, Podpowiedź i Tasuj."
        pt-BR: "Um nível 4 por 5 em andamento na mesa ensolarada. Cartas com imagens preenchem a grade sob pilhas de cartas viradas para cima, e uma imagem, um trole ferroviário vermelho, está parcialmente unida em uma peça maior. Embaixo ficam os botões Reiniciar, Desfazer, Dica e Embaralhar."
        ru: "Уровень 4 на 5 в процессе игры на солнечном столе. Карты с картинками заполняют сетку под стопками открытых карт, а одна картинка, красная дрезина, частично собрана в более крупную деталь. Внизу кнопки «Заново», «Отмена», «Подсказка» и «Перемешать»."
        tr: "Güneşli masada oynanan 4'e 5'lik bir seviye. Resimli kartlar, açık kart destelerinin altındaki ızgarayı dolduruyor; bir resim, kırmızı bir drezin, kısmen daha büyük bir parçaya birleşmiş. Altta Yeniden başla, Geri Al, İpucu ve Karıştır düğmeleri var."
        zh-Hans: "在晴朗桌面上进行中的 4×5 关卡。图画卡牌铺满网格，上方是翻开的牌堆，其中一幅画（一辆红色轨道手摇车）已部分拼成更大的一块。下方是重新开始、撤销、提示和洗牌按钮。"
