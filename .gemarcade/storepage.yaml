# Played on phones (portrait) and desktop browsers throughout. Tablets: QA played every screen
# at 768x1024, 820x1180 and 1024x1366 (portrait, touch) with no faults; on the largest the board
# stops growing at its card cap and leaves empty table. Never tried on a TV.
form_factors:
  phone: full
  tablet: full
  desktop: full
  tv: none

input_methods:
  touch: full
  kb_mouse: full
  gamepad: none

# Portrait-only (AGENTS.md ruling): a PC or TV letterboxes the game between the portrait borders.
orientations:
  phone:
    portrait: full
    landscape: none
  tablet:
    portrait: full
    landscape: none

modes:
  singleplayer: { min: 1, max: 1 }

accessibility: []

metadata:
