        en: "A finished destination unfolded into a painted postcard of Mont-Saint-Michel that covers the level, with its name and Normandy, France above it."
        de: "Ein fertiges Reiseziel, entfaltet zu einer gemalten Postkarte des Mont-Saint-Michel, die das Level bedeckt, darüber sein Name und „Normandie, Frankreich“."
        es: "Un destino completado, desplegado en una postal pintada del Mont-Saint-Michel que cubre el nivel, con su nombre y Normandía, Francia encima."
