<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound board</title>
<style>
  :root {
    --bg: #1d2633;
    --bg2: #253141;
    --card: #e9f0f7;
    --card-ink: #1f2a37;
    --muted: #5b6b7e;
    --amber: #f0a64a;
    --amber-ink: #3a2408;
    --keep: #4f9d6e;
    --remake: #c9604a;
    --line: #c9d6e3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: #dfe8f1; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { padding: 16px; background: radial-gradient(ellipse at top, #3a3f4a 0%, var(--bg) 55%) fixed, var(--bg); }
  header { max-width: 760px; margin: 0 auto 14px; }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: 0.2px; }
  header p { margin: 0; color: #b6c4d3; }
  .tally { margin-top: 8px; font-size: 13px; color: #b6c4d3; }
  .tally b { color: #fff; }
  ul { list-style: none; margin: 0 auto; padding: 0; max-width: 760px; display: grid; gap: 10px; }
  li { background: var(--card); color: var(--card-ink); border-radius: 18px; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; box-shadow: 0 3px 10px rgb(0 0 0 / 0.25); }
  li.music { background: #f6efe3; }
  .play { grid-row: span 2; width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--amber); color: var(--amber-ink); font-size: 20px; cursor: pointer; box-shadow: 0 3px 0 #b8742a; }
  .play:active { transform: translateY(2px); box-shadow: 0 1px 0 #b8742a; }
  .play[aria-pressed="true"] { background: #f6c27d; }
  .play:disabled { background: #c9d0d8; box-shadow: none; cursor: default; }
  .name { font-weight: 650; font-size: 16px; }
  .moment { color: var(--muted); font-size: 13.5px; }
  .actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
  .choice { min-height: 36px; padding: 0 16px; border-radius: 18px; border: 2px solid var(--line); background: #fff; color: var(--card-ink); font: inherit; font-weight: 600; cursor: pointer; }
  .choice.keep[aria-pressed="true"] { background: var(--keep); border-color: var(--keep); color: #fff; }
  .choice.remake[aria-pressed="true"] { background: var(--remake); border-color: var(--remake); color: #fff; }
  .small { min-height: 36px; padding: 0 12px; border-radius: 18px; border: 2px solid var(--line); background: transparent; color: var(--card-ink); font: inherit; font-size: 13px; cursor: pointer; }
  .note { flex: 1 1 220px; min-height: 36px; padding: 6px 12px; border-radius: 12px; border: 2px solid var(--line); font: inherit; font-size: 14px; color: var(--card-ink); background: #fff; }
  .note[hidden] { display: none; }
  .saved { font-size: 12px; color: var(--muted); opacity: 0; transition: opacity 0.3s; }
  .saved.on { opacity: 1; }
  .missing { color: var(--remake); font-size: 13px; }
  footer { max-width: 760px; margin: 14px auto 0; color: #93a3b5; font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <h1>Sound board</h1>
  <p>Play each sound at its level in the game, then mark it <b>Keep</b> or <b>Remake</b>. A note on what to change helps. Choices save as you go.</p>
  <div class="tally" id="tally"></div>
</header>
<ul id="list"><li>Loading…</li></ul>
<footer>Tip: start the music at the top, then play effects over it to hear the real mix.</footer>
<script>
"use strict";
let ctx, out, data, musicSource, musicGain;
const buffers = new Map();
const ext = document.createElement("audio").canPlayType('audio/ogg; codecs="opus"') ? "ogg" : "mp3";

function audio() {
  if (!ctx) {
    ctx = new AudioContext();
    // The game's soft limiter, so the mix here is the mix there.
    out = ctx.createDynamicsCompressor();
    out.threshold.value = -6; out.knee.value = 6; out.ratio.value = 8; out.attack.value = 0.003; out.release.value = 0.2;
    out.connect(ctx.destination);
  }
  if (ctx.state !== "running") ctx.resume();
  return ctx;
}

async function buffer(name) {
  if (!buffers.has(name)) {
    buffers.set(name, fetch(`audio/${name}.${ext}`).then((r) => r.arrayBuffer()).then((b) => audio().decodeAudioData(b)));
  }
  return buffers.get(name);
}

function voice(buf, level, { rate = 1, pan = 0, when = 0 } = {}) {
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.playbackRate.value = rate;
  const g = ctx.createGain();
  g.gain.value = level;
  const p = ctx.createStereoPanner();
  p.pan.value = pan;
  src.connect(g).connect(p).connect(out);
  src.start(ctx.currentTime + when);
}

async function playEffect(name) {
  audio();
  const buf = await buffer(name);
  const level = data.levels.effects[name] ?? 1;
  if (name === "deal") {
    // A refill across five stacks, as the game ripples it: left to right,
    // a little higher each column.
    for (let col = 0; col < 5; col++) {
      const across = col / 4;
      voice(buf, level, { rate: 0.94 + across * 0.14, pan: (across - 0.5) * 1.1, when: col * 0.07 });
    }
  } else {
    voice(buf, level);
  }
}

// The game's loop: the last seconds crossfaded into the first.
function makeLoop(buf, seconds) {
  const n = Math.min(Math.floor(seconds * buf.sampleRate), Math.floor(buf.length / 3));
  const tail = buf.length - n;
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n;
      d[tail + i] = d[tail + i] * Math.cos((t * Math.PI) / 2) + d[i] * Math.sin((t * Math.PI) / 2);
    }
  }
  return n / buf.sampleRate;
}

let loopReady = null;
async function startMusic(name, offsetFromEnd) {
  audio();
  stopMusic(true);
  const buf = await buffer(name);
  loopReady ??= makeLoop(buf, data.levels.crossfade ?? 4);
  musicSource = ctx.createBufferSource();
  musicSource.buffer = buf;
  musicSource.loop = true;
  musicSource.loopStart = loopReady;
  musicSource.loopEnd = buf.duration;
  musicGain = ctx.createGain();
  musicGain.gain.value = data.levels.music ?? 0.3;
  musicSource.connect(musicGain).connect(out);
  musicSource.start(0, offsetFromEnd ? Math.max(0, buf.duration - offsetFromEnd) : 0);
}

function stopMusic(now) {
  if (!musicSource) return;
  const s = musicSource, g = musicGain;
  musicSource = null;
  if (now) { s.stop(); return; }
  g.gain.setTargetAtTime(0, ctx.currentTime, 0.1);
  s.stop(ctx.currentTime + 0.5);
}

async function save(name, choice, note, row) {
  const res = await fetch("api/choice", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name, choice, note }) });
  if (res.ok) {
    data.choices[name] = await res.json();
    const s = row.querySelector(".saved");
    s.textContent = "Saved";
    s.classList.add("on");
    clearTimeout(s.timer);
    s.timer = setTimeout(() => s.classList.remove("on"), 1400);
  }
  tally();
}

function tally() {
  const total = data.sounds.length;
  const all = Object.values(data.choices).filter((c) => c && c.choice);
  const keep = all.filter((c) => c.choice === "keep").length;
  const remake = all.filter((c) => c.choice === "remake").length;
  document.getElementById("tally").innerHTML = `<b>${keep + remake}</b> of ${total} decided · ${keep} keep · ${remake} remake`;
}

function row(s) {
  const li = document.createElement("li");
  if (s.kind === "music") li.className = "music";
  const chosen = data.choices[s.name] || {};
  li.innerHTML = `
    <button class="play" type="button" aria-label="Play ${s.label}">▶</button>
    <div class="name"></div>
    <div class="moment"></div>
    <div class="actions">
      <button class="choice keep" type="button" aria-pressed="false">Keep</button>
      <button class="choice remake" type="button" aria-pressed="false">Remake</button>
      <input class="note" type="text" maxlength="1000" placeholder="What should change? (optional)" hidden>
      <span class="saved"></span>
    </div>`;
  li.querySelector(".name").textContent = s.label;
  li.querySelector(".moment").textContent = s.moment;
  const play = li.querySelector(".play");
  const keep = li.querySelector(".keep");
  const remake = li.querySelector(".remake");
  const note = li.querySelector(".note");
  let choice = chosen.choice ?? null;
  note.value = chosen.note ?? "";

  const show = () => {
    keep.setAttribute("aria-pressed", String(choice === "keep"));
    remake.setAttribute("aria-pressed", String(choice === "remake"));
    note.hidden = choice !== "remake";
  };
  show();

  if (!s.present) {
    play.disabled = true;
    li.querySelector(".moment").insertAdjacentHTML("beforeend", ' <span class="missing">(file missing)</span>');
  } else if (s.kind === "music") {
    play.addEventListener("click", async () => {
      const on = play.getAttribute("aria-pressed") === "true";
      if (on) { stopMusic(); play.textContent = "▶"; play.setAttribute("aria-pressed", "false"); return; }
      play.textContent = "■"; play.setAttribute("aria-pressed", "true");
      await startMusic(s.name);
    });
    const join = document.createElement("button");
    join.type = "button";
    join.className = "small";
    join.textContent = "Hear the loop join";
    join.title = "Starts 6 seconds before the music loops back to its start";
    join.addEventListener("click", async () => {
      play.textContent = "■"; play.setAttribute("aria-pressed", "true");
      await startMusic(s.name, 6);
    });
    li.querySelector(".actions").prepend(join);
  } else {
    play.addEventListener("click", () => playEffect(s.name));
  }

  keep.addEventListener("click", () => { choice = choice === "keep" ? null : "keep"; show(); save(s.name, choice, note.value, li); });
  remake.addEventListener("click", () => {
    choice = choice === "remake" ? null : "remake";
    show();
    if (choice === "remake") note.focus();
    save(s.name, choice, note.value, li);
  });
  let timer;
  note.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => save(s.name, choice, note.value, li), 700); });
  note.addEventListener("blur", () => { clearTimeout(timer); save(s.name, choice, note.value, li); });
  return li;
}

(async () => {
  data = await (await fetch("api/sounds")).json();
  const list = document.getElementById("list");
  list.replaceChildren(...data.sounds.map(row));
  tally();
})();
</script>
</body>
</html>
